services:
  web:
    build: .
    ports:
      # 8080-8084 sono già usate sul Pi (sillabe, homepage, parole)
      - "8085:80"
    depends_on:
      - stockfish
    # Se nginx non risponde per 3 controlli di fila, Docker segna il container "unhealthy"
    # e il guardiano del Pi (repo guardiano) lo riavvia
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  stockfish:
    build: ./server
    environment:
      SF_THREADS: "2"
      SF_HASH_MB: "64"
    # Limita il carico sul Pi (4 core): Stockfish usa al massimo 2 core.
    cpus: 2
    # Controllo di salute: GET /api/health (non usa il motore, quindi non pesa).
    # L'immagine python:slim non ha wget, per questo la richiesta la fa Python.
    # Se fallisce 3 volte di fila il container diventa "unhealthy" e il guardiano
    # del Pi (repo guardiano) lo riavvia
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
