server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno di Docker: risolvendo a runtime nginx parte anche se
    # il servizio stockfish non è ancora su.
    resolver 127.0.0.11 valid=30s;

    location ^~ /api/ {
        set $stockfish http://stockfish:8000;
        proxy_pass $stockfish;
        proxy_read_timeout 30s;
        client_max_body_size 4k;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }
}
